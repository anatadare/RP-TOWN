name = "rp-town-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# PENTING: tanpa baris ini, tiap kali Cloudflare auto-deploy dari GitHub
# (push ke branch yang terhubung), Wrangler bakal nimpa/ngosongin env var
# yang kamu isi manual lewat dashboard (Settings > Variables and Secrets) --
# ini kenapa AI_API_KEY dkk kelihatan "kehapus" tiap kali ada push baru.
# `keep_vars = true` bikin Wrangler biarin apa yang udah ada di dashboard,
# gak ditimpa ulang.
keep_vars = true

# Semua nilai di bawah ini CONTOH/placeholder, bukan yang beneran dipakai --
# di dashboard Cloudflare (Workers & Pages > rp-town-bot > Settings >
# Variables and Secrets) isi manual, atau lewat `wrangler secret put NAMA`.
# Yang sifatnya rahasia (token bot, API key, service role key) WAJIB lewat
# `wrangler secret put`, JANGAN ditulis langsung di file ini (file ini ikut
# masuk ke git).
#
# Daftar env yang dibutuhkan:
#   BOT_TOKEN, MINIAPP_URL, HOUSING_GROUP_CHAT_ID, HOUSING_GROUP_USERNAME,
#   WEBHOOK_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   AI_API_KEY, AI_MODEL, KUA_GROUP_CHAT_ID,
#   PENGHULU_1_TOKEN..PENGHULU_10_TOKEN (+ _NAME/_GROUP_IDS/_THREAD_IDS/_AI_API_KEY opsional per agent),
#   ASSISTANT_1_TOKEN..ASSISTANT_3_TOKEN (+ opsional yang sama)
#   KUA_GROUP_USERNAME (opsional -- isi kalau grup KUA-nya PUBLIC, dipakai
#     buat bikin link https://t.me/<username>/<threadId> ke ruangan yang
#     lagi kosong. Kalau grup privat, dikosongin aja, kodenya otomatis
#     jatuh ke format https://t.me/c/<internalId>/<threadId>.)
#
# PENTING buat fitur kick otomatis (lihat groupMembership.js): BOT_TOKEN
# (bot utama, BUKAN salah satu token PENGHULU_i/ASSISTANT_i) WAJIB jadi
# admin di grup KUA dengan izin "Ban users" -- soalnya banChatMember/
# unbanChatMember cuma bisa dieksekusi bot yang statusnya admin. Kalau
# lupa di-set, kick bakal gagal senyap (di-log doang) dan prosesi tetap
# resmi selesai, cuma warganya gak otomatis "keluar ruangan".
#
# NOTE (per switch ke Jerouter):
# - AI_API_KEY = API key dari Jerouter (yang muncul di mini app, contoh:
#   jr_cup_avy0yad9x7somwjffjav11n4fr5). Kalau tiap bot mau pakai key
#   sendiri-sendiri, isi PENGHULU_i_AI_API_KEY / ASSISTANT_i_AI_API_KEY.
# - AI_MODEL = "f/qwen3.8-flash" (WAJIB pakai prefix "f/" sesuai dokumentasi
#   Jerouter). Kalau env ini dikosongkan, aiClient.js sudah fallback ke nilai
#   ini secara default, tapi lebih aman diisi eksplisit.
# - GEMINI_API_KEY (OPSIONAL, pakai `wrangler secret put GEMINI_API_KEY`) --
#   kalau diisi, Gemini API LANGSUNG ikut jadi kandidat di aiClient.js
#   (bersaing sama model Jerouter lewat skor organik + hedged request).
#   GEMINI_MODEL opsional, default "gemini-2.5-flash-lite" (paling kencang &
#   limit gratisnya paling longgar). Kalau GEMINI_API_KEY kosong, perilaku
#   sama persis kayak sebelumnya (Jerouter saja). Bisa juga per agent:
#   PENGHULU_i_GEMINI_API_KEY / ASSISTANT_i_GEMINI_API_KEY.

# ============================================================
# TELLER BANK (setor via bayar.gg + agent Gemini)
# Semua di bawah ini lewat `wrangler secret put` / dashboard Cloudflare.
#
#   TELLER_1_TOKEN         token bot teller (bot BARU dari BotFather, bukan token Penghulu/Pegawai)
#   BANK_GROUP_CHAT_ID     id grup "RP Town Bank" (format -100xxxxxxxxxx)
#   TELLER_1_THREAD_IDS    (opsional) id topic "setor dan tarik uang"
#   GEMINI_API_KEY         (sudah ada di atas) dipakai teller juga
#   BAYARGG_API_KEY        API key bayar.gg (bayar.gg > login > lihat API Key)
#   BAYARGG_WEBHOOK_SECRET Webhook Secret Key (bayar.gg > Developer > Webhook & Callback)
#   PUBLIC_WORKER_URL      URL publik Worker ini, mis. https://rp-town-bot.xxx.workers.dev
#   BAYARGG_PAYMENT_METHOD (opsional) default "qris" (maks Rp 500.000/transaksi).
#                          Alternatif: qris_bayar_gg, gopay_qris, qris_livin, qris_user
#   BAYARGG_PAYMENT_URL    (opsional) default https://www.bayar.gg/pay
#   DEPOSIT_MIN_IDR / DEPOSIT_MAX_IDR (opsional) default 5000 / 500000
#   COINGECKO_API_KEY      (opsional tapi disarankan) Demo key gratis CoinGecko
#   COINGECKO_TON_ID       (opsional) default "the-open-network"
#
# Set webhook bot teller ke: <PUBLIC_WORKER_URL>/webhook/agent/teller-1
# Whitelist IP webhook bayar.gg kalau Worker dipasang di belakang WAF/Bot Fight
# Mode: 95.169.180.225 (daftar terbaru: https://www.bayar.gg/api/webhook-ips.php)
